name: Android
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm check && pnpm test --run
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - run: pnpm build:apk
        env:
          AALL_VERSION_CODE: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: aall-apk
          path: artifacts/aall.apk
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aall-apk
          path: artifacts
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'build-tools;37.0.0'
      - name: Sign APK with persistent release key
        env:
          KEYSTORE: ${{ secrets.AALL_KEYSTORE_BASE64 }}
          AALL_STORE_PASSWORD: ${{ secrets.AALL_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          test -n "$AALL_STORE_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/aall.jks"
          zip -d artifacts/aall.apk 'META-INF/*' || true
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks "$RUNNER_TEMP/aall.jks" --ks-key-alias aall --ks-pass env:AALL_STORE_PASSWORD --out artifacts/aall-signed.apk artifacts/aall.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose artifacts/aall-signed.apk
          rm "$RUNNER_TEMP/aall.jks"
      - name: Publish for Obtainium
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/aall-signed.apk --repo "$GITHUB_REPOSITORY" --generate-notes
