[tools]
node = "26.13.0"
pnpm = "12.16.1"
java = "25.0.5+8.0.LTS"
android-sdk = "23.0"
vp = "1.5.0"
ktlint = "1.8.0"

[tasks.install]
run = "pnpm install --frozen-lockfile"
[tasks.check]
run = "pnpm typecheck && pnpm check && pnpm test"
[tasks.android]
run = "pnpm android"
[tasks.apk]
run = "pnpm build:apk"
