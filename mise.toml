[tools]
node = "26.13.0"
pnpm = "12.16.1"
java = "25.0.5+8.0.LTS"
android-sdk = "23.0"
vp = "1.5.0"
ktlint = "1.8.0"
gradle = "9.9.0"

[tasks.install]
run = "pnpm install --frozen-lockfile"
[tasks.check]
run = "pnpm typecheck && pnpm check && pnpm test && mise run test:kotlin"
[tasks."test:kotlin"]
run = "gradle -p modules/aall-automation/jvm-tests test --console=plain -q"
[tasks.android]
run = "pnpm android"
[tasks.apk]
run = "pnpm build:apk"
